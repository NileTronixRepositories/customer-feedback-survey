@if (open()) {
  <div
    class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 backdrop-blur-[4px] transition-opacity duration-200"
    (click)="onBackdropClick($event)"
  >
    <section
      #dialog
      tabindex="-1"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      class="modal-dialog flex w-full flex-col overflow-hidden border border-slate-200/90 bg-white shadow-2xl shadow-slate-950/25 transition-all duration-200"
      [class.max-w-md]="size() === 'sm'"
      [class.max-w-xl]="size() === 'md'"
      [class.max-w-4xl]="size() === 'lg'"
      [class.max-w-5xl]="size() === 'xl'"
      [class.max-w-6xl]="size() === '2xl'"
    >
      <header
        class="modal-header flex shrink-0 items-center justify-between gap-3 border-b border-slate-100"
      >
        <div class="flex items-center gap-3 min-w-0">
          @if (icon()) {
            <div
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-teal-50 text-[var(--theme-color-primary,#148496)] border border-teal-200/70 shadow-2xs"
            >
              <i [class]="icon() + ' text-base'"></i>
            </div>
          } @else {
            <span
              class="h-6 w-1.5 shrink-0 rounded-full bg-[var(--theme-color-primary,#148496)]"
            ></span>
          }
          <div class="min-w-0">
            <h2 class="truncate text-sm sm:text-base font-black leading-6 text-slate-900">
              {{ title() }}
            </h2>
            @if (subtitle()) {
              <p class="mt-0.5 truncate text-xs font-semibold text-slate-500">{{ subtitle() }}</p>
            }
          </div>
        </div>
        <button
          type="button"
          class="inline-flex h-8.5 w-8.5 shrink-0 items-center justify-center rounded-xl border border-slate-200/80 bg-white text-slate-400 shadow-2xs transition hover:bg-slate-50 hover:text-slate-700 hover:border-slate-300 focus:outline-none focus:ring-2 focus:ring-[var(--theme-focus-ring)] cursor-pointer"
          [attr.aria-label]="'common.closeModal' | t"
          (click)="closed.emit()"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </header>
      <div class="modal-body min-h-0 flex-1 overflow-y-auto custom-scrollbar">
        <ng-content />
      </div>
    </section>
  </div>
}
