@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/50 p-2 backdrop-blur-[3px] transition-opacity duration-200 sm:items-center sm:p-4"
    (click)="onBackdropClick($event)"
  >
    <section
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      class="flex max-h-[calc(100dvh-2rem)] w-full flex-col overflow-hidden rounded-2xl border border-slate-200/90 bg-white shadow-2xl shadow-slate-950/25 transition-all duration-200 sm:max-h-[calc(100dvh-3.5rem)]"
      [class.max-w-md]="size() === 'sm'"
      [class.max-w-xl]="size() === 'md'"
      [class.max-w-4xl]="size() === 'lg'"
      [class.max-w-5xl]="size() === 'xl'"
      [class.max-w-6xl]="size() === '2xl'"
    >
      <header
        class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-100 bg-white px-5 py-3.5 sm:px-6 sm:py-4"
      >
        <div class="min-w-0">
          <h2 class="truncate text-base font-extrabold leading-6 text-slate-900">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="mt-0.5 truncate text-xs font-semibold text-slate-500">{{ subtitle() }}</p>
          }
        </div>
        <button
          type="button"
          class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-[var(--theme-focus-ring)]"
          [attr.aria-label]="'common.closeModal' | t"
          (click)="closed.emit()"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </header>
      <div class="min-h-0 flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-5">
        <ng-content />
      </div>
    </section>
  </div>
}
