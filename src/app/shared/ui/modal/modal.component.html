@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/45 p-2 backdrop-blur-[2px] sm:items-center"
  >
    <section
      class="max-h-[calc(100dvh-1rem)] w-full overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-2xl shadow-slate-950/20 sm:max-h-[calc(100dvh-2rem)]"
      [class.max-w-xl]="size() === 'md'"
      [class.max-w-4xl]="size() === 'lg'"
      [class.max-w-5xl]="size() === 'xl'"
    >
      <header
        class="flex items-center justify-between gap-3 border-b border-slate-100 bg-white px-5 py-3.5"
      >
        <h2 class="min-w-0 text-base font-bold leading-6 text-slate-900">{{ title() }}</h2>
        <button
          type="button"
          class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-[var(--theme-focus-ring)]"
          [attr.aria-label]="'common.closeModal' | t"
          (click)="closed.emit()"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </header>
      <div class="max-h-[calc(100dvh-5.5rem)] overflow-y-auto custom-scrollbar p-4 sm:p-5">
        <ng-content />
      </div>
    </section>
  </div>
}
