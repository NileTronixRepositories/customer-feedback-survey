@if (confirmService.activeDialog(); as dialog) {
  <div
    class="fixed inset-0 z-[1100] flex items-center justify-center bg-slate-950/50 p-4 backdrop-blur-xs transition-opacity duration-200"
    (click)="onBackdropClick($event)"
  >
    <section
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="dialog.title"
      class="relative m-auto w-full max-w-md overflow-hidden rounded-3xl border border-slate-100 bg-white p-6 sm:p-7 text-center shadow-2xl shadow-slate-950/25 transition-all duration-200 animate-in zoom-in-95"
    >
      @if (dialog.variant === 'danger') {
        <div
          class="pointer-events-none absolute -top-16 left-1/2 h-28 w-56 -translate-x-1/2 rounded-full bg-rose-500/10 blur-2xl"
        ></div>
      } @else if (dialog.variant === 'warning') {
        <div
          class="pointer-events-none absolute -top-16 left-1/2 h-28 w-56 -translate-x-1/2 rounded-full bg-amber-500/10 blur-2xl"
        ></div>
      }

      <button
        type="button"
        class="absolute end-4 top-4 inline-flex h-8 w-8 items-center justify-center rounded-xl text-slate-400 transition hover:bg-slate-100 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-300"
        [attr.aria-label]="dialog.cancelText"
        (click)="confirmService.cancel()"
      >
        <app-icon [icon]="closeIcon" [size]="16" />
      </button>

      <div
        [class]="'mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl border shadow-inner transition-transform duration-200 hover:scale-105 ' + badgeWrapperClass(dialog.variant ?? 'danger')"
      >
        <app-icon
          [icon]="iconFor(dialog.variant ?? 'danger')"
          [size]="28"
          [strokeWidth]="2.2"
        />
      </div>

      <h3 class="text-lg font-black text-slate-900 tracking-tight leading-snug">
        {{ dialog.title }}
      </h3>

      <p class="mt-2 text-sm font-semibold text-slate-600 leading-relaxed">
        {{ dialog.message }}
      </p>

      @if (dialog.itemName) {
        <div
          class="mt-3.5 inline-flex max-w-full items-center gap-2 rounded-xl bg-slate-50 border border-slate-200/90 px-3.5 py-1.5 text-xs font-bold text-slate-800 shadow-2xs truncate"
        >
          <span class="h-2 w-2 shrink-0 rounded-full bg-[var(--theme-color-accent)]"></span>
          <span class="truncate">{{ dialog.itemName }}</span>
        </div>
      }

      @if (dialog.description) {
        <p class="mt-2 text-xs font-medium text-slate-500 leading-relaxed">
          {{ dialog.description }}
        </p>
      }

      <div class="mt-6 flex items-center gap-3">
        <button
          type="button"
          class="flex-1 h-11 px-4 rounded-xl border border-slate-200 bg-white font-bold text-slate-700 text-xs hover:bg-slate-50 hover:text-slate-900 transition-all shadow-2xs cursor-pointer focus:outline-none focus:ring-2 focus:ring-slate-300 active:scale-[0.98]"
          (click)="confirmService.cancel()"
        >
          {{ dialog.cancelText }}
        </button>

        <button
          type="button"
          [class]="'flex-1 h-11 px-4 rounded-xl font-extrabold text-xs transition-all shadow-md cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-1 active:scale-[0.98] ' + confirmButtonClass(dialog.variant ?? 'danger')"
          (click)="confirmService.accept()"
        >
          {{ dialog.confirmText }}
        </button>
      </div>
    </section>
  </div>
}
