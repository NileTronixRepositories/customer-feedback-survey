<div
  class="app-shell h-dvh overflow-hidden bg-[var(--color-background)] xl:grid xl:grid-cols-[var(--sidebar-width)_minmax(0,1fr)] xl:transition-[grid-template-columns] xl:duration-300"
  [style.--sidebar-width]="sidebarCollapsed() ? '5.25rem' : '18rem'"
>
  @if (mobileSidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-slate-950/45 backdrop-blur-[2px] xl:hidden"
      [attr.aria-label]="'common.closeSidebar' | t"
      (click)="closeMobileSidebar()"
    ></button>
  }

  <app-sidebar
    [collapsed]="sidebarCollapsed()"
    [mobileOpen]="mobileSidebarOpen()"
    (toggle)="toggleSidebar()"
    (close)="closeMobileSidebar()"
  />
  <div class="flex h-dvh min-w-0 flex-col">
    <header class="app-header sticky top-0 z-30 shrink-0">
      <div class="header-container flex items-center justify-between gap-2 sm:gap-3">
        <div class="header-left flex min-w-0 items-center gap-2 sm:gap-3">
          <div class="role-icon-tile">
            <app-icon [icon]="roleIcon()" [size]="20" />
          </div>
          <div class="page-meta min-w-0">
            <div class="header-badges flex min-w-0 flex-wrap items-center gap-1.5">
              <div class="role-badge flex items-center gap-1.5">
                <app-icon [icon]="roleIcon()" [size]="10" />
                <span>{{ roleBadgeLabel() }}</span>
              </div>
              @if (branchDisplayName(); as branchName) {
                <div
                  class="flex min-w-0 max-w-[12rem] items-center gap-1.5 rounded-full border border-slate-200 bg-white/90 px-2 py-0.5 text-[0.7rem] font-extrabold text-slate-600 shadow-sm sm:max-w-[16rem]"
                  [title]="branchName"
                >
                  <app-icon [icon]="branchIcon" [size]="10" />
                  <span class="truncate">{{ branchName }}</span>
                </div>
              }
            </div>
            <h1 class="page-title truncate">{{ pageTitle() }}</h1>
          </div>
        </div>

        <div class="header-right flex shrink-0 items-center gap-2">
          <button
            type="button"
            class="lang-toggle-btn"
            [attr.aria-label]="'common.changeLanguage' | t"
            (click)="i18n.toggleLanguage()"
          >
            <span class="icon-circle">
              <app-icon [icon]="languagesIcon" [size]="14" />
            </span>
            <span class="header-action-label">{{ i18n.nextLanguageLabel() }}</span>
          </button>

          <button
            type="button"
            class="lang-toggle-btn"
            [attr.aria-label]="'common.changePassword' | t"
            (click)="changePassword()"
          >
            <span class="icon-circle">
              <app-icon [icon]="changePasswordIcon" [size]="14" />
            </span>
            <span class="hidden sm:inline">{{ 'common.changePassword' | t }}</span>
          </button>

          <button type="button" class="logout-btn" (click)="logout()">
            <app-icon [icon]="logoutIcon" [size]="16" />
            <span class="hidden sm:inline">{{ 'common.logout' | t }}</span>
          </button>
        </div>
      </div>
    </header>
    <main class="app-content container-fluid flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto">
      <router-outlet />
    </main>
    <app-footer class="shrink-0" />
  </div>
</div>
