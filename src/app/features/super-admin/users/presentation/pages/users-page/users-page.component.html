<div class="w-full space-y-4">
  <app-page-header
    [title]="'users.adminManagement' | t"
    [description]="'users.subtitle' | t"
    [icon]="usersIcon"
  >
    @if (canCreateSuperAdmin()) {
      <app-button type="button" size="md" (pressed)="openCreateSuperAdmin()">
        <app-icon [icon]="createIcon" [size]="15" />
        {{ 'users.createSuperAdmin' | t }}
      </app-button>
    }
  </app-page-header>

  <div class="space-y-3">
    @if (usersStore.success()) {
      <div
        class="border border-emerald-100 bg-emerald-50 p-3 text-xs font-semibold text-emerald-700"
      >
        {{ usersStore.success() ?? '' | t }}
      </div>
    }

    @if (usersStore.error()) {
      <div
        class="border border-rose-100 bg-rose-50 p-3 text-xs font-semibold text-[var(--theme-color-danger)]"
      >
        {{ usersStore.error() ?? '' | t }}
      </div>
    }

    <app-user-table
      [users]="usersStore.users()"
      (resetPasswordRequested)="openResetPassword($event)"
    />
  </div>
</div>

<app-reset-password-modal
  [open]="resetPasswordModalOpen()"
  [loading]="usersStore.resettingPassword()"
  [selectedUserLabel]="selectedUserLabel()"
  (closed)="closeResetPassword()"
  (confirmed)="resetPassword($event)"
/>

<app-modal
  [title]="'users.createSuperAdmin' | t"
  [open]="createSuperAdminModalOpen()"
  (closed)="closeCreateSuperAdmin()"
  size="lg"
>
  <form class="space-y-4" [formGroup]="createSuperAdminForm" (ngSubmit)="createSuperAdmin()">
    <div class="grid gap-3 md:grid-cols-2">
      <app-input
        [label]="'users.nameEn' | t"
        [placeholder]="'users.nameEnPlaceholder' | t"
        formControlName="nameEn"
        [error]="createSuperAdminFieldError('nameEn') | t"
      />
      <app-input
        [label]="'users.nameAr' | t"
        [placeholder]="'users.nameArPlaceholder' | t"
        formControlName="nameAr"
        [error]="createSuperAdminFieldError('nameAr') | t"
      />
    </div>

    <div class="grid gap-3 md:grid-cols-2">
      <app-input
        [label]="'branches.userName' | t"
        [placeholder]="'users.userNamePlaceholder' | t"
        formControlName="userName"
        [error]="createSuperAdminFieldError('userName') | t"
      />
      <app-input
        [label]="'common.email' | t"
        type="email"
        [placeholder]="'users.emailPlaceholder' | t"
        formControlName="email"
        [error]="createSuperAdminFieldError('email') | t"
      />
    </div>

    <div class="grid gap-3 md:grid-cols-2">
      <app-input
        [label]="'branches.phoneNumber' | t"
        [placeholder]="'users.phoneNumberPlaceholder' | t"
        formControlName="phoneNumber"
        [error]="createSuperAdminFieldError('phoneNumber') | t"
      />
      <app-input
        [label]="'common.password' | t"
        type="password"
        [placeholder]="'users.passwordPlaceholder' | t"
        formControlName="password"
        [error]="createSuperAdminFieldError('password') | t"
      />
    </div>

    <div class="sticky bottom-0 -mx-4 -mb-4 mt-4 flex items-center justify-end gap-2 border-t border-slate-100 bg-white/95 px-4 py-3 backdrop-blur-sm sm:-mx-5 sm:-mb-5 sm:px-5 z-10">
      <app-button type="button" variant="secondary" (pressed)="closeCreateSuperAdmin()">
        {{ 'common.cancel' | t }}
      </app-button>
      <app-button
        type="submit"
        [disabled]="!canCreateSuperAdmin()"
        [loading]="usersStore.creatingSuperAdmin()"
      >
        <app-icon [icon]="createIcon" [size]="17" />
        {{ 'common.create' | t }}
      </app-button>
    </div>
  </form>
</app-modal>
