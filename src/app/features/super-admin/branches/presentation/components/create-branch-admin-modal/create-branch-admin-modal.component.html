<app-modal
  [title]="'branches.createBranchAdmin' | t"
  [open]="open()"
  (closed)="close()"
>
  <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
    @if (selectedBranch(); as branch) {
      <div
        class="flex items-center gap-2 rounded-xl border border-[var(--theme-color-accent)]/20 bg-[var(--theme-color-accent-softest)]/50 p-3 text-xs font-semibold text-slate-700 shadow-2xs"
      >
        <span class="text-slate-500">{{ 'branches.selectBranch' | t }}:</span>
        <span class="font-bold text-[var(--theme-color-secondary)]">
          {{ branchDisplayName(branch) }}
        </span>
      </div>
      <input type="hidden" formControlName="branchId" />
    } @else {
      <label class="block">
        <span class="mb-2 block text-xs font-semibold text-slate-700">
          {{ 'branches.selectBranch' | t }}
        </span>
        <select
          class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none transition focus:border-[var(--theme-color-accent)] focus:ring-4 focus:ring-[var(--theme-color-accent)]/10"
          formControlName="branchId"
        >
          <option value="">{{ 'branches.selectBranchPlaceholder' | t }}</option>
          @for (branch of branches(); track branch.id) {
            <option [value]="branch.id">{{ branchDisplayName(branch) }}</option>
          }
        </select>
        @if (fieldError('branchId')) {
          <span class="mt-2 block text-xs font-medium text-[var(--theme-color-danger)]">
            {{ fieldError('branchId') }}
          </span>
        }
      </label>
    }

    <div class="grid gap-3 md:grid-cols-2">
      <app-input
        [label]="'branches.adminNameEn' | t"
        [placeholder]="'branches.adminNameEnPlaceholder' | t"
        formControlName="nameEn"
        [error]="fieldError('nameEn')"
      />
      <app-input
        [label]="'branches.adminNameAr' | t"
        [placeholder]="'branches.adminNameArPlaceholder' | t"
        formControlName="nameAr"
        [error]="fieldError('nameAr')"
      />
    </div>

    <app-input
      [label]="'branches.userName' | t"
      [placeholder]="'branches.userNamePlaceholder' | t"
      formControlName="userName"
      [error]="fieldError('userName')"
    />

    <div class="grid gap-3 md:grid-cols-2">
      <app-input
        [label]="'common.email' | t"
        type="email"
        [placeholder]="'branches.emailPlaceholder' | t"
        formControlName="email"
        [error]="fieldError('email')"
      />
      <app-input
        [label]="'branches.phoneNumber' | t"
        [placeholder]="'branches.phoneNumberPlaceholder' | t"
        formControlName="phoneNumber"
        [error]="fieldError('phoneNumber')"
      />
    </div>

    <app-input
      [label]="'common.password' | t"
      type="password"
      [placeholder]="'auth.passwordPlaceholder' | t"
      formControlName="password"
      [error]="fieldError('password')"
    />

    <div
      class="sticky bottom-0 z-10 -mx-4 -mb-4 mt-4 flex items-center justify-end gap-2 border-t border-slate-100 bg-white/95 px-4 py-3 backdrop-blur-sm sm:-mx-5 sm:-mb-5 sm:px-5"
    >
      <app-button type="button" variant="secondary" [disabled]="loading()" (pressed)="close()">
        {{ 'common.cancel' | t }}
      </app-button>
      <app-button type="submit" [loading]="loading()">
        <app-icon [icon]="userPlusIcon" [size]="17" />
        {{ 'branches.createBranchAdmin' | t }}
      </app-button>
    </div>
  </form>
</app-modal>
